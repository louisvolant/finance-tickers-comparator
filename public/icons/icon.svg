<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Candlesticks / Bar charts in background -->
  <rect x="110" y="240" width="36" height="150" rx="8" fill="url(#bar1)" opacity="0.6"/>
  <rect x="124" y="200" width="8" height="230" rx="4" fill="#475569" opacity="0.4"/>

  <rect x="190" y="190" width="36" height="200" rx="8" fill="url(#bar1)" opacity="0.7"/>
  <rect x="204" y="150" width="8" height="270" rx="4" fill="#475569" opacity="0.5"/>

  <rect x="270" y="220" width="36" height="170" rx="8" fill="url(#bar1)" opacity="0.6"/>
  <rect x="284" y="170" width="8" height="250" rx="4" fill="#475569" opacity="0.4"/>

  <rect x="350" y="140" width="36" height="250" rx="8" fill="url(#bar2)" opacity="0.85"/>
  <rect x="364" y="100" width="8" height="320" rx="4" fill="#10b981" opacity="0.7"/>

  <!-- Dynamic upward trend curve -->
  <path d="M 80 370 C 150 350, 180 270, 250 250 C 310 230, 360 170, 430 110" 
        fill="none" 
        stroke="url(#glow)" 
        stroke-width="20" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Target node on top of trend -->
  <circle cx="430" cy="110" r="18" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="430" cy="110" r="10" fill="#10b981" />

  <!-- Subtle ticker badge bottom accent -->
  <rect x="120" y="420" width="272" height="32" rx="16" fill="#1e293b" opacity="0.8"/>
  <text x="256" y="442" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="3">TICKER TRACKER</text>
</svg>
